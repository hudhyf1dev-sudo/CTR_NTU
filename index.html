<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفوّقي | السادس العلمي</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <div id="home-screen" class="card-container">
            <h1 class="app-title">تفوّقي 🎓</h1>
            <p class="app-desc">اختبار تفاعلي لمادة اللغة الإنجليزية - الصف السادس العلمي</p>
            <button id="start-btn" class="btn primary-btn">ابدأ الاختبار</button>
        </div>

        <div id="quiz-screen" class="card-container hidden">
            <div class="quiz-header">
                <span id="question-tracker">السؤال 1</span>
                <div class="score-badge">الدرجة: <span id="current-score">0</span></div>
            </div>
            
            <div class="question-box">
                <h2 id="question-text" dir="ltr">Question Text</h2>
                <div id="options-container" class="options-grid">
                    </div>
            </div>

            <div id="feedback-box" class="feedback hidden">
                </div>

            <button id="next-btn" class="btn secondary-btn hidden">السؤال التالي</button>
        </div>

        <div id="result-screen" class="card-container hidden">
            <h2>انتهى الاختبار 🎉</h2>
            <p>لقد أتممت جميع الأسئلة بنجاح!</p>
            <div class="final-score-box">
                <span class="score-label">درجتك النهائية</span>
                <h1 id="final-score" class="score-number">0</h1>
            </div>
            <button id="restart-btn" class="btn primary-btn">إعادة الاختبار</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
